<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoxClean — Recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F5F7}
a{color:#16181D}a:hover{color:#000000}
a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #16181D;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #F4F5F7; color: #16181D; font-family: 'Instrument Sans', system-ui, sans-serif">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 10px 24px; background: #FFFFFF; border-bottom: 1px solid #E3E5EA">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: #16181D; text-decoration: none">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#16181D"></rect><path d="M7 12v4M11 8v12M15 10v8M19 14h3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">VoxClean</span>
</a>
<nav aria-label="Steps">
<ol style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: 14px">
<li aria-current="step" style="display: flex; align-items: center; gap: 8px; font-weight: 600"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 999px; background: #16181D; color: #FFFFFF; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">1</span>Audio</li>
<li style="display: flex; align-items: center; gap: 8px; color: #5B616E"><span aria-hidden="true" style="width: 28px; height: 1px; background: #C9CDD4"></span><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 1px solid #868C98; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">2</span>Transcript</li>
<li style="display: flex; align-items: center; gap: 8px; color: #5B616E"><span aria-hidden="true" style="width: 28px; height: 1px; background: #C9CDD4"></span><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 1px solid #868C98; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">3</span>Result</li>
</ol>
</nav>
<div style="display: flex; align-items: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #F4F5F7; font-size: 13px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>On this computer</span>
<a href="Setup.dc.html" aria-label="Models and settings" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: #16181D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg></a>
</div>
</header>

<main style="flex: 1 1 auto; width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 24px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 20px">
<section aria-labelledby="rec-title" style="display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 40px 32px; background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 20px; text-align: center">
<h1 id="rec-title" style="margin: 0; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #FDEDE4; color: #9A3412; font-size: 14px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #C2410C"></span>Recording</h1>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<p role="timer" aria-label="Recording duration: 42 seconds" style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.03em">00:42</p>
<p style="margin: 0; font-size: 14px; color: #5B616E">Built-in microphone</p>
</div>
<svg viewBox="0 0 360 80" role="img" aria-label="Microphone input level" style="width: 100%; max-width: 520px; height: auto" fill="none" stroke-linecap="round" stroke-width="4">
<path stroke="#16181D" d="M5 39V41M15 38V42M25 35V45M35 31V49M45 34V46M55 37V43M65 32V48M75 27V53M85 21V59M95 28V52M105 33V47M115 36V44M125 30V50M135 24V56M145 17V63M155 23V57M165 29V51M175 35V45M185 38V42M195 36V44M205 32V48M215 26V54M225 20V60M235 15V65M245 22V58M255 28V52M265 33V47M275 36V44M285 34V46M295 28V52M305 21V59M315 24V56M325 31V49M335 36V44M345 30V50"></path>
<path stroke="#C2410C" d="M355 24V56"></path>
</svg>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 36px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #16181D; font-size: 14px; text-decoration: none">
<span aria-hidden="true" style="width: 56px; height: 56px; margin-top: 12px; border-radius: 999px; border: 1px solid #868C98; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span>Discard</a>
<a href="ClipReady.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #16181D; font-size: 14px; font-weight: 600; text-decoration: none">
<span aria-hidden="true" style="width: 80px; height: 80px; border-radius: 999px; background: #C2410C; display: inline-flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 6px; background: #FFFFFF"></span></span>Stop</a>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #16181D; font: inherit; font-size: 14px; cursor: pointer">
<span aria-hidden="true" style="width: 56px; height: 56px; margin-top: 12px; border-radius: 999px; border: 1px solid #868C98; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg></span>Pause</button>
</div>
</section>
<p style="margin: 0; text-align: center; font-size: 14px; line-height: 1.5; color: #5B616E">Transcription starts when you stop. The recording is kept in memory only and cleared when you close VoxClean.</p>
</main>

<footer style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 12px 24px; background: #FFFFFF; border-top: 1px solid #E3E5EA; font-size: 13px; color: #5B616E">
<div style="display: flex; flex-wrap: wrap; gap: 8px 20px">
<span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #15803D"></span>Whisper <span style="font-family: 'IBM Plex Mono', monospace; color: #16181D">base</span> ready</span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #15803D"></span>Ollama <span style="font-family: 'IBM Plex Mono', monospace; color: #16181D">llama3.2</span> ready</span>
</div>
<a href="Setup.dc.html" style="color: #5B616E">Manage models</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
